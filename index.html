<div id="app"><p class="mu">Loading your Financial Floor…</p></div><nav id="nav" hidden aria-label="Main navigation"></nav><div id="ov"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SUPABASE_URL = 'https://kplyiweyascwgdapwdzo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_k4AipUXfHtEjfOJ1Atv5Ng_70GGVqCA';

let supabaseClient = null;
try {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  console.error('Supabase init failed:', e);
}

let importedTx = [];

async function loadImported() {
  if (!supabaseClient) {
    console.warn('Supabase client not available');
    return;
  }
  try {
    const { data, error } = await supabaseClient
      .from('imported_transactions')
      .select('id, source_app, notification_title, notification_text, amount, direction, transaction_type, captured_at, reviewed')
      .order('captured_at', { ascending: false })
      .limit(100);
    if (error) {
      console.error('Imported transactions error:', error);
      return;
    }
    importedTx = data || [];
    newlyImportedReviewIds = processImportedTransactions(importedTx);
    // Keep review actions visible on Home instead of unexpectedly opening a modal.
    // Skip re-render while the profile form is open so unsaved input is not wiped.
    if (!modalKind && isProfileComplete() && !editingProfile && !confirmProfileOnThisVersion) render();
  } catch (e) {
    console.error('loadImported failed:', e);
  }
}

function importedRow(t) {
  const dir = inferDirection(t) || 'unknown';
  const dirLabel = dir === 'credit' ? 'Incoming' : dir === 'debit' ? 'Outgoing' : 'Direction unclear';
  const dirClass = dir === 'credit' ? 'pos' : dir === 'debit' ? 'neg' : '';
  const amount = importedAmount(t);
  const amt = amount != null ? N2(amount) : '—';
  const stamp = timestampMs(t.captured_at);
  const time = stamp ? when(stamp) : 'Time unavailable';
  const status = importedStatus(t);
  const ledgerEntries = entriesForImport(t.id);
  const pending = ledgerEntries.find(e => e.bucket === 'pending' && Number(e.amount) < 0);
  const actions = pending ? `<div class="import-actions"><button type="button" data-review-tx="${esc(String(t.id))}">Choose wallet</button></div>` : '';
  const details = t.notification_text || '';
  return `<div class="rw import-row">
    <span class="ci">${ic(dir === 'credit' ? 'arrow-down-left' : 'arrow-up-right')}</span>
    <span class="g">
      <b>${esc(t.source_app || 'Unknown')} · ${esc(t.notification_title || 'Notification')}</b>
      <small>${esc(dirLabel)} · ${esc(time)}${t.reviewed ? ' · Reviewed in source' : ''}</small>
      <span class="status-pill ${status.kind}">${esc(status.label)}</span>
      ${details ? `<div class="subtle" style="margin-top:4px">${esc(details)}</div>` : ''}
      ${actions}
    </span>
    <b class="${dirClass}">${amt}</b>
  </div>`;
}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const LEGACY_STORAGE_KEY='financial-floor-standalone-v1';
let STORAGE_KEY=LEGACY_STORAGE_KEY;
const LEGACY_WELCOME_CONFIRMED_KEY='financial-floor-profile-confirmed-v3';
let WELCOME_CONFIRMED_KEY=LEGACY_WELCOME_CONFIRMED_KEY;
const THEME_KEY='financial-floor-theme';
const LEGACY_FRESH_START_KEY='financial-floor-fresh-start-v2';
let FRESH_START_KEY=LEGACY_FRESH_START_KEY;
let activeAuthUserId=null;
const MS=[7,30,90,180];
const DEFAULT_WALLETS=[
  {key:'feeding',name:'Feeding',icon:'utensils'},
  {key:'transport',name:'Transport',icon:'bus'},
  {key:'data',name:'Data',icon:'smartphone'}
];
const N=n=>(n<0?'-':'')+'₦'+Math.round(Math.abs(Number(n)||0)).toLocaleString('en-NG');
const N2=n=>'₦'+(Number(n)||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1),ic=(n,c)=>`<i data-lucide="${esc(n)}"${c?` class="${esc(c)}"`:''} aria-hidden="true"></i>`;
const DEFAULT_CFG={bareBones:3000,targetDays:180,floorPct:30,waitHours:72,splits:{feeding:50,transport:25,data:25},solo:true};
const BAD=/\$[a-z]{2,}|\b(token|coin|memecoin|pump|dip|ape|ticker|trade|trading|leverage)\b/i;
const NAV=[['home','house','Home'],['wallets','wallet','Wallets'],['activity','activity','Activity'],['goals','target','Floor goals'],['profile','user-round','Profile']];
const WALLET_ICONS=['wallet','circle-dollar-sign','shopping-bag','car','home','heart','book','gift','coffee','music','plane','briefcase','utensils','bus','smartphone','piggy-bank','credit-card','banknote'];

const STATES = ['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta','Ebonyi','Edo','Ekiti','Enugu','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi','Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara','FCT Abuja'];
const SALARY_RANGES = ['Under ₦50,000','₦50,000 – ₦100,000','₦100,000 – ₦200,000','₦200,000 – ₦500,000','₦500,000 – ₦1,000,000','Above ₦1,000,000','Prefer not to say'];
const INCOME_SOURCES = ['Salary / Employment','Business / Self-employed','Freelance / Contract','Student','Pension / Allowance','Other'];

let state=loadState(),view='home',wd=null,sel=null,filt='all',hide=readHide(),modalKind=null,toastTimer=null,editingProfile=false,confirmProfileOnThisVersion=false,theme=localStorage.getItem(THEME_KEY)||'light';
let newlyImportedReviewIds=[];
// Authentication is enforced before the financial app can render. Verification is handled by Supabase Auth.
let authReady=false, authStage='loading', authMessage='', pendingProfile=null, authBusy=false;
const PENDING_PROFILE_KEY='financial-floor-pending-auth-profile-v1';
function readPendingProfile(){try{return JSON.parse(sessionStorage.getItem(PENDING_PROFILE_KEY)||'null')}catch(_){return null}}
function writePendingProfile(p){pendingProfile=p;try{sessionStorage.setItem(PENDING_PROFILE_KEY,JSON.stringify(p))}catch(_){}}
function clearPendingProfile(){pendingProfile=null;try{sessionStorage.removeItem(PENDING_PROFILE_KEY)}catch(_){}}
function normalizePhone(value){let p=String(value||'').replace(/[\s().-]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);if(p.startsWith('0'))p='+234'+p.slice(1);if(/^234\d{10}$/.test(p))p='+'+p;return p}
function phoneIsE164(p){return /^\+[1-9]\d{7,14}$/.test(p)}
function applyFreshStartOnce(){
  try{
    if(localStorage.getItem(FRESH_START_KEY)==='1')return;
    state.ledger=[];
    state.requests=[];
    state.notes=[];
    state.trackingStartedAt=null;
    state.openingBalance=null;
    state.heldImportIds=[];
    state.version=2;
    persist();
    localStorage.setItem(FRESH_START_KEY,'1');
  }catch(e){console.warn('Fresh-start migration could not be saved:',e)}
}
applyFreshStartOnce();
try{confirmProfileOnThisVersion=!!state.profile?.name&&localStorage.getItem(WELCOME_CONFIRMED_KEY)!=='1'}catch(e){confirmProfileOnThisVersion=!!state.profile?.name}

function activateUserStorage(user){
  if(!user?.id)throw new Error('Supabase did not return a valid user.');
  const id=String(user.id);
  const userKey=`financial-floor-standalone-v1:user:${id}`;
  const welcomeKey=`financial-floor-profile-confirmed-v3:user:${id}`;
  const freshKey=`financial-floor-fresh-start-v2:user:${id}`;
  if(!localStorage.getItem(userKey)){
    let migrated=false;
    try{
      const raw=localStorage.getItem(LEGACY_STORAGE_KEY);
      if(raw&&user.email){
        const legacy=JSON.parse(raw);
        const owner=String(legacy?.profile?.email||'').trim().toLowerCase();
        if(owner&&owner===String(user.email).trim().toLowerCase()){
          localStorage.setItem(userKey,raw);
          if(localStorage.getItem(LEGACY_WELCOME_CONFIRMED_KEY)==='1')localStorage.setItem(welcomeKey,'1');
          migrated=true;
        }
      }
    }catch(e){console.warn('Existing local data could not be migrated:',e)}
    if(!migrated)localStorage.setItem(userKey,JSON.stringify(freshState()));
  }
  // This version's first-run reset applies to the legacy store only. The user-specific store
  // is either a verified email-matched migration or a fresh state.
  if(!localStorage.getItem(freshKey))localStorage.setItem(freshKey,'1');
  STORAGE_KEY=userKey;WELCOME_CONFIRMED_KEY=welcomeKey;FRESH_START_KEY=freshKey;activeAuthUserId=id;
  state=loadState();
  confirmProfileOnThisVersion=!!state.profile?.name&&localStorage.getItem(WELCOME_CONFIRMED_KEY)!=='1';
}
async function bootAuth(){
  authReady=false;authStage='loading';
  if(!supabaseClient){authReady=true;authStage='register';authMessage='Authentication service is unavailable. Check the Supabase URL and publishable key.';render();return}
  try{
    const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;
    const user=data?.session?.user;
    if(user&&user.email_confirmed_at){
      activateUserStorage(user);
      const metadata=user.user_metadata||{};
      if(!state.profile?.name){state.profile={name:metadata.name||'',email:user.email||'',phone:''};persist()}
      else if(String(state.profile.email||'').toLowerCase()!==String(user.email||'').toLowerCase()){
        state.profile={name:metadata.name||'',email:user.email||'',phone:''};persist();
      }
      authStage='ready';pendingProfile=null;
    }else{
      const pending=readPendingProfile();
      pendingProfile=pending||null;
      if(pending?.email){authStage='verify_email';authMessage='Enter the code already sent to your email, or resend it.'}
      else{authStage='register';authMessage=''}
    }
  }catch(e){authStage='register';authMessage='Could not confirm your sign-in status. Check your connection and try again.';console.error('Auth bootstrap failed:',e)}
  authReady=true;render();
}
async function startAuthRegistration(){
  if(authBusy)return;authMessage='';
  const profile={name:$('#authNm').value.trim(),email:$('#authEm').value.trim().toLowerCase()};
  if(!profile.name||!profile.email){authMessage='Enter your name and a valid email address.';render();return}
  writePendingProfile(profile);authBusy=true;render();
  try{
    const {error}=await supabaseClient.auth.signInWithOtp({email:profile.email,options:{shouldCreateUser:true,data:{name:profile.name}}});
    if(error)throw error;
    authStage='verify_email';authMessage='A one-time code has been sent. Check your inbox and spam folder.';
  }catch(e){authStage='register';authMessage=e.message||'Could not send the email code. Check the address and try again.'}
  finally{authBusy=false;render()}
}
async function verifyEmailOtp(){
  if(authBusy)return;authBusy=true;authMessage='';const token=$('#emailOtp').value.trim();const p=pendingProfile||readPendingProfile();render();
  try{
    if(!p?.email)throw new Error('Your email details are missing. Restart sign-in.');
    const {data,error}=await supabaseClient.auth.verifyOtp({email:p.email,token,type:'email'});if(error)throw error;
    if(!data?.user||!data.user.email_confirmed_at)throw new Error('Supabase did not confirm the email. Please try the code again.');
    activateUserStorage(data.user);
    const currentEmail=String(state.profile?.email||'').trim().toLowerCase();
    const sameUserProfile=currentEmail===String(data.user.email||p.email).trim().toLowerCase()?state.profile:{};
    state.profile={...sameUserProfile,name:sameUserProfile.name||p.name||data.user.user_metadata?.name||'',email:data.user.email||p.email,phone:sameUserProfile.phone||''};
    persist();clearPendingProfile();authStage='ready';authMessage='';editingProfile=false;confirmProfileOnThisVersion=false;view='home';
  }catch(e){authStage='verify_email';authMessage=e.message||'Email verification failed. Check the code and try again.'}
  finally{authBusy=false;render();if(authStage==='ready')toast('Email verified. Welcome to Financial Floor.')}
}
async function resendAuthCode(){
  if(authBusy)return;authBusy=true;authMessage='';render();const p=pendingProfile||readPendingProfile();

    authMessage='A new email code has been requested. Check your inbox and spam folder.';

}

function render(){const app=$('#app'),nav=$('#nav');if(!authReady||authStage!=='ready'){nav.hidden=true;app.innerHTML=authStage==='loading'?'<div class="auth-card"><h1>Checking verification…</h1><p class="mu">Please wait while Financial Floor checks your secure session.</p></div>':authScreen();icons();applyBalanceVisibility(document.body);return}if(!isProfileComplete()||editingProfile||confirmProfileOnThisVersion){nav.hidden=true;app.innerHTML=vProfile();icons();applyBalanceVisibility(document.body);return}nav.hidden=false;nav.innerHTML=NAV.map(([k,i,l])=>`<button type="button" data-v="${k}" class="${view===k?'on':''}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join('');app.innerHTML=V[view]?V[view]() : '';icons();applyBalanceVisibility(document.body)}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2800)}
function sheet(title,html,setup){modalKind=title;$('#ov').innerHTML=`<div class="ov"><div class="sh" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><span>${esc(title)}</span><button type="button" id="cl" aria-label="Close">${ic('x')}</button></div>${html}<div class="msg" id="msg" role="status"></div></div></div>`;icons();$('#cl').onclick=closeSheet;$('.ov').onclick=e=>{if(e.target.classList.contains('ov'))closeSheet()};if(setup)setup();applyBalanceVisibility(document.body)}

function closeSheet(){modalKind=null;$('#ov').innerHTML=''}
function fail(msg){const m=$('.msg');if(m){m.textContent=msg;m.className='msg bad'}else toast(msg)}
const amountField='<label for="a">Amount (₦)</label><input id="a" type="number" min="1" step="1" inputmode="numeric" required>';
function readAmount(){const v=Number($('#a').value);if(!Number.isSafeInteger(v)||v<=0)throw new Error('Enter a positive whole naira amount.');return v}
function wsel(id,sel){return`<select id="${id}">${getWallets().map(w=>`<option value="${w.key}" ${w.key===sel?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`}
function recentNotes(){const s=new Set();state.ledger.filter(e=>e.type==='spend'&&e.note).slice(0,20).forEach(e=>s.add(e.note));return[...s].slice(0,6)}
function finish(text){persist();closeSheet();render();toast(text)}
function actionForm(k,p){
 if(k==='in'){
   const starting=!state.trackingStartedAt,initialShares=walletShares();
   const intro=starting?`<div class="warn">Enter the exact available balance currently shown in Spenda. This sets your opening balance; it is not a new deposit. Check Spenda immediately before confirming and avoid transacting during setup.</div>`:`<div class="warn">Use this for money that is not already reflected in Spenda's imported transactions. Do not manually add a Spenda transfer that FF has already imported, or the total will be counted twice.</div>`;
   sheet(starting?'Set starting Spenda balance':'Add money manually',`${intro}<label for="a">${starting?'Current available Spenda balance (₦)':'Amount to add (₦)'}</label><input id="a" type="number" min="1" step="1" inputmode="numeric" required><label for="fp">Financial Floor allocation (%) · minimum 10%</label><input id="fp" type="number" min="10" max="100" step="1" value="${Math.max(10,state.cfg.floorPct)}"><label>Allocate the remainder across wallets</label>${allocationFields('share',initialShares)}<label for="n">Description (optional)</label><input id="n" maxlength="100" placeholder="${starting?'Opening Spenda balance':'What is this addition for?'}"><label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin-top:12px"><input id="saveAlloc" type="checkbox" ${starting?'checked':''} ${starting?'disabled':''}> Use these percentages for future automatic incoming credits</label><div id="pv"></div><button type="button" class="go" id="go">${starting?'Confirm starting balance':'Add and allocate money'}</button>`,()=>{
     const pv=()=>{const a=Number($('#a').value)||0,fp=Number($('#fp').value),shares=readAllocationShares('share');$('#pv').innerHTML=allocationPreview(a,fp,shares)};
     $('#a').oninput=pv;$('#fp').oninput=pv;getWallets().forEach(w=>{const f=$(`#share_${w.key}`);if(f)f.oninput=pv});pv();
     $('#go').onclick=()=>{try{
       const a=readAmount(),f=Number($('#fp').value),shares=validateAllocationShares(readAllocationShares('share'));
       if(!Number.isSafeInteger(f)||f<10||f>100)throw new Error('Financial Floor allocation must be between 10% and 100%.');
       if(starting&&state.trackingStartedAt)throw new Error('Tracking has already been started. Close this window and refresh.');
       const parts=split(a,f,shares),note=$('#n').value.trim()||(starting?'Opening Spenda balance':'Manual addition');
       const entries=[];if(parts.floor>0)entries.push({type:starting?'opening':'in',bucket:'floor',amount:parts.floor,refill:parts.refill>0,note,sourceApp:starting?'Spenda opening balance':'Manual'});
       getWallets().forEach(w=>{if((parts[w.key]||0)>0)entries.push({type:starting?'opening':'in',bucket:w.key,amount:parts[w.key],note,sourceApp:starting?'Spenda opening balance':'Manual'})});
       addLedger(entries);
       if(starting||$('#saveAlloc').checked){state.cfg.floorPct=f;state.cfg.splits={...state.cfg.splits,...shares};}
       if(starting){state.trackingStartedAt=Date.now();state.openingBalance=a;state.version=2;addNote(`Starting Spenda balance set to ${N(a)}. Existing imported notifications were not applied.`)}
       else if($('#saveAlloc').checked)addNote('Default automatic allocation percentages updated from a manual addition.');
       addNote(`${N(a)} ${starting?'starting balance':'manual addition'} allocated: ${N(parts.floor)} to the floor and ${N(a-parts.floor)} across wallets.`);
       finish(starting?'Starting balance saved. Spenda tracking is active.':`Allocated ${N(a)} across your floor and wallets.`);
       if(starting)loadImported();
     }catch(e){fail(e.message)}}
   });return
 }
 if(k==='spend'){const notes=recentNotes();const chips=notes.length?`<div class="quick-chips">${notes.map(n=>`<button type="button" data-note="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:'';sheet('Spend',`<label for="w1">Wallet</label>${wsel('w1',p||getWallets()[0]?.key)}${amountField}<label for="n">What was it for?</label>${chips}<input id="n" maxlength="60" placeholder="e.g. groceries"><button type="button" class="go" id="go">Log spend</button>`,()=>{document.querySelectorAll('[data-note]').forEach(btn=>btn.onclick=()=>{$('#n').value=btn.dataset.note});$('#go').onclick=()=>{try{const a=readAmount(),w=$('#w1').value,n=$('#n').value.trim(),{b}=calc();if(!n)throw new Error('Describe what the expense was for.');if(a>b[w])throw new Error(`${getWallet(w).name} has only ${N(b[w])}. Move money into this wallet first.`);addLedger([{type:'spend',bucket:w,amount:-a,note:n}]);addNote(`${N(a)} spent from your ${getWallet(w).name} wallet for ${n}.`);finish(`Logged ${N(a)} from ${getWallet(w).name}.`)}catch(e){fail(e.message)}}});return}
 if(k==='move'){const wallets=getWallets();sheet('Move money',`<div class="row"><div><label for="w1">From</label>${wsel('w1',p||wallets[0]?.key)}</div><div><label for="w2">To</label>${wsel('w2',wallets.find(w=>w.key!==(p||wallets[0]?.key))?.key||wallets[1]?.key)}</div></div>${amountField}<p class="mu">The protected floor is not a transfer source. Use Release floor for a floor release.</p><button type="button" class="go" id="go">Move money</button>`,()=>{$('#go').onclick=()=>{try{const a=readAmount(),f=$('#w1').value,t=$('#w2').value,{b}=calc();if(f===t)throw new Error('Choose two different wallets.');if(a>b[f])throw new Error(`${getWallet(f).name} has only ${N(b[f])}.`);addLedger([{type:'move',bucket:f,amount:-a,note:'to '+getWallet(t).name},{type:'move',bucket:t,amount:a,note:'from '+getWallet(f).name}]);addNote(`${N(a)} moved from ${getWallet(f).name} to ${getWallet(t).name}.`);finish(`Moved ${N(a)} from ${getWallet(f).name} to ${getWallet(t).name}.`)}catch(e){fail(e.message)}}});return}
 if(k==='addwallet'){sheet('Create new wallet',`<label for="wn">Wallet name</label><input id="wn" maxlength="30" placeholder="e.g. Savings, Rent, Fun" required><label for="wi">Icon</label><select id="wi">${WALLET_ICONS.map(i=>`<option value="${i}">${i.replace(/-/g,' ')}</option>`).join('')}</select><button type="button" class="go" id="go">Create wallet</button>`,()=>{$('#go').onclick=()=>{try{const name=$('#wn').value.trim();if(!name)throw new Error('Enter a name for the wallet.');const icon=$('#wi').value||'wallet';const key=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();if(getWallets().some(w=>w.key===key))throw new Error('A wallet with a similar name already exists.');state.wallets=getWallets();state.wallets.push({key,name,icon});persist();closeSheet();toast(`Wallet “${name}” created.`);setTimeout(()=>actionForm('move',key),300)}catch(e){fail(e.message)}}});return}
 if(k==='manage'){const w=getWallet(p);sheet('Manage '+w.name,`<label for="rn">Rename</label><input id="rn" maxlength="30" value="${esc(w.name)}"><label for="ri">Change icon</label><select id="ri">${WALLET_ICONS.map(i=>`<option value="${i}" ${i===w.icon?'selected':''}>${i.replace(/-/g,' ')}</option>`).join('')}</select><label for="bud">Monthly budget (₦, optional)</label><input id="bud" type="number" min="0" step="1" value="${getBudget(p)||''}" placeholder="0 = no budget"><div class="row"><button type="button" class="go" id="saveM">Save changes</button></div><button type="button" class="go danger" id="delM">Delete wallet</button>`,()=>{$('#saveM').onclick=()=>{try{const name=$('#rn').value.trim();if(!name)throw new Error('Name cannot be empty.');const icon=$('#ri').value;const bud=Number($('#bud').value)||0;if(bud<0)throw new Error('Budget cannot be negative.');const idx=state.wallets.findIndex(x=>x.key===p);if(idx>=0){state.wallets[idx].name=name;state.wallets[idx].icon=icon}if(!state.budgets)state.budgets={};if(bud>0)state.budgets[p]=bud;else delete state.budgets[p];finish('Wallet updated.')}catch(e){fail(e.message)}};$('#delM').onclick=()=>{if(!confirm(`Delete “${w.name}”? Its history stays, but the wallet will be removed from the list.`))return;state.wallets=state.wallets.filter(x=>x.key!==p);if(state.budgets)delete state.budgets[p];if(wd===p)wd=null;finish('Wallet deleted.')}});return}
 if(k==='rel'){sheet('Release floor',`<p class="mu">Floor releases are for essential needs such as food, shelter, or medical expenses. Your balance stays unchanged while the request is waiting. In personal mode, you can approve an eligible request after its waiting period.</p>${amountField}<label for="r">Reason</label><select id="r"><option>Food</option><option>Shelter</option><option>Medical</option><option>Other</option></select><label for="n">Describe the need</label><input id="n" maxlength="80" placeholder="Briefly explain the expense"><button type="button" class="go" id="go">Request release</button>`,()=>{$('#go').onclick=()=>{try{const a=readAmount(),reason=$('#r').value,n=$('#n').value.trim(),{b}=calc();if(a>b.floor)throw new Error(`The floor holds only ${N(b.floor)}.`);if(!n)throw new Error('Describe why you need the release.');const blocked=reason==='Other'||BAD.test(n),t=Date.now(),r={id:uid(),amount:a,reason,note:n,createdAt:t,releaseAt:t+Math.max(0,Number(state.cfg.waitHours)||0)*36e5,status:blocked?'blocked':'waiting'};state.requests.unshift(r);addNote(blocked?`Your floor release request for ${N(a)} was blocked. Use an eligible essential-expense reason.`:`Your floor release request for ${N(a)} was recorded. It is waiting for approval; your floor has not changed.`);if(blocked){persist();render();closeSheet();toast('Request blocked by the floor rules.')}else finish('Release request recorded.')}catch(e){fail(e.message)}}});return}
 if(k==='count'){sheet('Compare with Spenda',`<p class="mu">Enter the current available Spenda balance. This check records the difference but does not silently rewrite your transaction history or wallet allocations.</p><label for="a">Current Spenda balance (₦)</label><input id="a" type="number" min="0" step="1" inputmode="numeric" placeholder="0"><button type="button" class="go" id="go">Compare totals</button>`,()=>{$('#go').onclick=()=>{try{const raw=$('#a').value;if(raw===''||!Number.isSafeInteger(Number(raw))||Number(raw)<0)throw new Error('Enter a valid total of zero or more.');const{total}=calc(),diff=Number(raw)-total,msg=diff===0?'Reconciled: your actual total matches the ledger.':diff<0?`Reconciliation: ${N(-diff)} less than the ledger is in your actual accounts.`:`Reconciliation: your actual accounts contain ${N(diff)} more than the ledger.`;addNote(msg);finish(msg)}catch(e){fail(e.message)}}});return}
 if(k==='set'){const c=state.cfg,shares=walletShares(c.splits);sheet('Floor settings',`<label for="s_bb">Bare-bones cost per day (₦)</label><input id="s_bb" type="number" min="1" step="1" value="${c.bareBones}"><div class="row"><div><label for="s_td">Floor target (days)</label><input id="s_td" type="number" min="7" step="1" value="${c.targetDays}"></div><div><label for="s_fp">Floor allocation (%) · minimum 10%</label><input id="s_fp" type="number" min="10" max="100" step="1" value="${Math.max(10,c.floorPct)}"></div></div><label for="s_wh">Release waiting period (hours)</label><input id="s_wh" type="number" min="0" step="0.5" value="${c.waitHours}"><p class="mu">When the floor target is reached, the cap can reduce further floor allocations; the configured rate itself cannot be set below 10%.</p><label>Wallet split of the amount left after the floor (must total 100%)</label>${getWallets().map(w=>`<div class="row" style="align-items:center;margin-top:7px"><div class="g"><b>${esc(w.name)}</b><small>Share of remainder</small></div><div style="max-width:110px"><input id="s_${esc(w.key)}" type="number" min="0" max="100" step="1" value="${Math.round(shares[w.key]||0)}" aria-label="${esc(w.name)} share percentage"></div></div>`).join('')}<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="s_solo" type="checkbox" ${c.solo?'checked':''}> Allow personal approval of my own eligible floor releases</label><p class="subtle">This is a personal tracker, not independent financial approval. Keep the waiting period if you want a pause before releasing protected money.</p><button type="button" class="go" id="go">Save settings</button>`,()=>{$('#go').onclick=()=>{try{const bareBones=Number($('#s_bb').value),targetDays=Number($('#s_td').value),floorPct=Number($('#s_fp').value),waitHours=Number($('#s_wh').value),splits={};getWallets().forEach(w=>splits[w.key]=Number($('#s_'+w.key).value));if(!Number.isSafeInteger(bareBones)||bareBones<=0)throw new Error('Daily cost must be a positive whole naira amount.');if(!Number.isSafeInteger(targetDays)||targetDays<7||targetDays>3650)throw new Error('Target days must be between 7 and 3650.');if(!Number.isSafeInteger(floorPct)||floorPct<10||floorPct>100)throw new Error('Floor allocation must be between 10 and 100.');if(!Number.isFinite(waitHours)||waitHours<0||waitHours>8760)throw new Error('Waiting period must be between 0 and 8760 hours.');if(getWallets().some(w=>!Number.isSafeInteger(splits[w.key])||splits[w.key]<0||splits[w.key]>100)||getWallets().reduce((sum,w)=>sum+splits[w.key],0)!==100)throw new Error('Wallet splits must be whole percentages that add up to exactly 100.');state.cfg={...state.cfg,bareBones,targetDays,floorPct,waitHours,splits,solo:$('#s_solo').checked};addNote('Your financial floor settings were updated.');finish('Settings saved.')}catch(e){fail(e.message)}}});return}
 if(k==='export'){exportBackup();return}
 if(k==='import'){importBackup();return}
 if(k==='resetbalance'){sheet('Reset balances to zero',`<div class="warn">This clears the financial ledger and pending wallet reviews on this device. It keeps your profile, wallet names, budgets and allocation settings. Existing Spenda notifications in Supabase are not deleted and will not be counted until you set a new opening balance.</div><p class="mu">Export a backup first if you may need the current history later. After resetting, the total will be ₦0 and automatic transaction processing will pause until you enter the current Spenda balance again.</p><label for="confirmResetBalance">Type RESET to confirm</label><input id="confirmResetBalance" autocomplete="off"><button type="button" class="go danger" id="go">Reset balances</button>`,()=>{$('#go').onclick=()=>{if($('#confirmResetBalance').value!=='RESET'){fail('Type RESET exactly to confirm.');return}try{state.ledger=[];state.requests=[];state.notes=[];state.trackingStartedAt=null;state.openingBalance=null;state.heldImportIds=[];persist();closeSheet();view='home';wd=null;render();toast('Balances reset to zero. Set your current Spenda balance to restart tracking.')}catch(e){fail(e.message)}}});return}
 if(k==='reset'){sheet('Reset app data',`<div class="warn">This permanently deletes the financial data saved by this app in this browser. Export a backup first if you may need it later.</div><label for="confirmReset">Type RESET to confirm</label><input id="confirmReset" autocomplete="off"><button type="button" class="go" id="go">Delete local data</button>`,()=>{$('#go').onclick=()=>{if($('#confirmReset').value!=='RESET'){fail('Type RESET exactly to confirm.');return}try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(WELCOME_CONFIRMED_KEY);state=freshState();state.trackingStartedAt=null;state.openingBalance=null;localStorage.setItem(FRESH_START_KEY,'1');view='home';wd=null;sel=null;editingProfile=false;confirmProfileOnThisVersion=false;closeSheet();render();toast('App data reset. Set up your profile and starting Spenda balance.')}catch(e){fail(e.message)}}});return}
}
function notifs(){const unread=state.notes.filter(n=>!n.read).length;sheet('Notifications',`<div class="row" style="align-items:center;margin:8px 0 3px"><span class="mu">${unread} unread</span>${unread?'<button type="button" class="go s" style="margin:0" id="ma">Mark all as read</button>':''}</div>${state.notes.slice(0,50).map(n=>`<button type="button" class="nt ${n.read?'':'u'}" data-r="${n.id}"><span class="d"></span><span>${esc(n.text)}<br><small class="mu">${when(n.t)}</small></span></button>`).join('')||'<div class="empty">No notifications yet. They will appear after financial activity.</div>'}`,()=>{const b=$('#ma');if(b)b.onclick=()=>{state.notes.forEach(n=>n.read=true);persist();notifs();render()}})}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='financial-floor-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup exported.')}
function importBackup(){sheet('Import backup',`<p class="mu">Choose a JSON backup previously exported by Financial Floor. Importing replaces the data currently stored in this browser.</p><label for="backupFile">Backup file</label><input id="backupFile" type="file" accept="application/json,.json"><button type="button" class="go" id="go">Import data</button>`,()=>{$('#go').onclick=async()=>{try{const file=$('#backupFile').files?.[0];if(!file)throw new Error('Choose a backup file first.');const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.ledger)||!Array.isArray(data.notes)||!Array.isArray(data.requests)||!data.cfg)throw new Error('This does not look like a valid Financial Floor backup.');state={...freshState(),...data,profile:data.profile||null,wallets:data.wallets||DEFAULT_WALLETS,budgets:data.budgets||{},cfg:{...DEFAULT_CFG,...data.cfg,splits:{...DEFAULT_CFG.splits,...(data.cfg.splits||{})}},ledger:data.ledger,notes:data.notes,requests:data.requests};persist();view='home';wd=null;closeSheet();render();toast('Backup imported.')}catch(e){fail(e.message)}}})}
document.addEventListener('click',e=>{const c=s=>e.target.closest(s);let x;if(c('#eye')){hide=!hide;saveHide();render()}else if(x=c('[data-v]')){view=x.dataset.v;wd=null;render();window.scrollTo(0,0)}else if(x=c('[data-w]')){view='wallets';wd=x.dataset.w||null;render();window.scrollTo(0,0)}else if(x=c('[data-ms]')){sel=Number(x.dataset.ms);view='home';wd=null;render()}else if(x=c('[data-f]')){filt=x.dataset.f;render()}else if(c('[data-n]'))notifs();else if(x=c('[data-a]'))actionForm(x.dataset.a,x.dataset.p);else if(x=c('[data-review-tx]'))reviewImportedTransaction(x.dataset.reviewTx);else if(x=c('[data-r]')){const n=state.notes.find(n=>n.id===x.dataset.r);if(n)n.read=true;persist();notifs();render()}else if(x=c('[data-act]')){const r=state.requests.find(r=>r.id===x.dataset.id);if(!r||r.status!=='waiting')return;if(x.dataset.act==='approved'&&Date.now()<r.releaseAt){toast('This request is still within its waiting period.');return}if(x.dataset.act==='approved'&&r.amount>calc().b.floor){toast('The floor no longer has enough money to approve this request.');return}const labels={approved:'approved',denied:'denied',cancelled:'cancelled'};r.status=x.dataset.act;r.decidedAt=Date.now();if(r.status==='approved'){addLedger([{type:'release',bucket:'floor',amount:-r.amount,note:r.reason+(r.note?': '+r.note:'')}])}addNote(`Your floor release request of ${N(r.amount)} was ${labels[r.status]}.`);try{persist();render();toast(`Release request ${labels[r.status]}.`)}catch(err){toast(err.message)}}else if(c('[data-edit-profile]')){editingProfile=true;render();const input=$('#nm');if(input){input.focus();input.select()}}else if(c('[data-theme-toggle]')){theme=theme==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,theme)}catch(err){}document.documentElement.setAttribute('data-theme',theme);render()}});
document.addEventListener('change',e=>{if(e.target.id!=='pic')return;const input=e.target,file=input.files&&input.files[0];if(!file)return;if(file.size>1.5*1024*1024){toast('Please choose an image under 1.5 MB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{const preview=$('#picPrev');if(preview){preview.src=reader.result;preview.style.display='block'}window._pendingPicture=reader.result};reader.readAsDataURL(file)});
document.addEventListener('submit',e=>{if(e.target.id==='authRegisterForm'){e.preventDefault();void startAuthRegistration();return}if(e.target.id==='verifyEmailForm'){e.preventDefault();void verifyEmailOtp();return}if(e.target.id==='welcomeForm'){e.preventDefault();const name=$('#nm').value.trim();const email=supabaseClient?.auth?state.profile?.email||$('#em').value.trim():$('#em').value.trim();const phone=$('#ph').value.trim();const dob=$('#dob').value;const st=$('#st').value;const address=$('#ad').value.trim();const source=$('#so').value;const salary=$('#sr').value;if(!name||!email||!dob||!st||!address||!source||!salary){toast('Please fill in all required fields.');return}const picture=window._pendingPicture||state.profile?.picture||'';state.profile={...state.profile,name,email,phone,dob,state:st,address,sourceOfIncome:source,salaryRange:salary,picture};try{persist();editingProfile=false;confirmProfileOnThisVersion=false;try{localStorage.setItem(WELCOME_CONFIRMED_KEY,'1')}catch(_){}delete window._pendingPicture;view='home';render();toast('Profile saved.');}catch(err){toast(err.message)}}});
document.addEventListener('click',e=>{if(e.target.closest('[data-sign-out]')){void signOutUser();return}if(e.target.closest('#resendEmailOtp')){void resendAuthCode();return}if(e.target.closest('#restartAuth')){clearPendingProfile();authStage='register';pendingProfile=null;authMessage='';authBusy=false;render();return}if(e.target.closest('#authRetry')){authMessage='';void bootAuth();return}});
document.addEventListener('click',e=>{if(e.target.closest('#cancelProfileEdit')){editingProfile=false;confirmProfileOnThisVersion=false;delete window._pendingPicture;view='profile';render();return}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){state=loadState();render()}});
setInterval(()=>{
  // Do not rebuild the page while the user is filling or editing the profile form
  if(modalKind) return;
  if(!isProfileComplete() || editingProfile || confirmProfileOnThisVersion) return;
  if(state.profile?.name) render();
},60000);
setInterval(()=>{if(authReady&&authStage==='ready'&&document.visibilityState==='visible')loadImported()},20000);
const balanceMaskObserver=new MutationObserver(()=>{if(hide)applyBalanceVisibility(document.body)});
balanceMaskObserver.observe(document.body,{subtree:true,childList:true,characterData:true});
try {
  void localStorage.getItem(STORAGE_KEY);
  render();
  void bootAuth().then(()=>{if(authStage==='ready')loadImported()});
} catch (e) {
  console.error(e);
  document.getElementById('app').innerHTML = '<div class="c"><h1>Something went wrong</h1><p class="mu">Check the console for details.</p></div>';
}
document.addEventListener('click', e => {
  if (e.target.id === 'refreshImported') loadImported();
});
</script>
